services:
  - type: web
    name: moonvape-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.3}
      - {key: BOT_TOKEN, sync: false}
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SERVICE_ROLE_KEY, sync: false}
      - {key: WEBAPP_URL, sync: false}
      - {key: OWNER_TELEGRAM_ID, value: "7858672760"}
      - {key: OWNER_USERNAME, sync: false}
